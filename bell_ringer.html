<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bell Ringer / Exit Ticket</title>
<style>
  :root{
    --purple1:#cd9bff; --purple2:#ab90ff; --purple3:#a78bfa;
    --bg1:#cd9bff; --bg2:#8b5cf6;
    --card:#ffffff; --text:#2d2250; --muted:#7a71a3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Segoe UI',system-ui,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background:var(--card); border-radius:24px; padding:32px 28px;
    max-width:520px; width:100%; box-shadow:0 20px 50px rgba(30,20,80,.35);
    position:relative; overflow:hidden;
  }
  .header{margin-bottom:24px;}
  .emoji{font-size:36px; margin-bottom:8px;}
  h1{font-size:22px; margin:0 0 4px; color:var(--text);}
  .sub{color:var(--muted); font-size:14px; margin-bottom:18px;}
  .form-section{margin-bottom:20px;}
  .form-section label{
    display:block; font-size:14px; font-weight:600; color:var(--text); margin-bottom:8px;
  }
  select, textarea, input[type=text]{
    width:100%; padding:12px 14px; border:2px solid #e4e0f7; border-radius:12px;
    font-size:15px; outline:none; transition:border .2s; color:var(--text);
    font-family:inherit;
  }
  select:focus, textarea:focus, input[type=text]:focus{border-color:var(--purple2);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .two-col select{width:100%; margin:0;}
  textarea{
    resize:vertical; min-height:60px; margin-bottom:16px;
  }
  .q-label{
    font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px;
  }
  .q-label.optional{color:var(--muted); font-weight:500;}
  .question-field{display:none;}
  .question-field.active{display:block;}
  .divider{height:1px; background:#e4e0f7; margin:20px 0;}
  .nav{display:flex; gap:10px; margin-top:22px;}
  button{
    flex:1; border:none; border-radius:12px; padding:14px 18px; font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .15s, box-shadow .15s;
  }
  button:active{transform:scale(.97);}
  .btn-submit{
    background:linear-gradient(135deg,var(--purple1),var(--purple2)); color:#fff; box-shadow:0 8px 20px rgba(106,90,205,.35);
  }
  .btn-submit:disabled{opacity:.4; box-shadow:none; cursor:default;}
  .done{text-align:center; padding:20px 0;}
  .done .emoji{font-size:48px; margin-bottom:12px;}
  .done h2{color:var(--text); margin:0 0 6px; font-size:20px;}
  .done p{color:var(--muted); font-size:14px;}
  .status{font-size:13px; margin-top:10px; color:var(--muted);}
  .opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    padding:12px 14px; border:2px solid #e4e0f7; border-radius:12px; cursor:pointer;
    font-size:14px; color:var(--text); text-align:center; background:#faf9ff;
    transition:all .15s; font-weight:600; user-select:none;
  }
  .opt:hover{border-color:var(--purple3); background:#f2effc;}
  .opt.selected{background:linear-gradient(135deg,var(--purple1),var(--purple2)); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(106,90,205,.3);}
  .scale-row{display:flex; gap:6px; margin-bottom:6px;}
  .scale-btn{
    flex:1; padding:10px 0; border:2px solid #e4e0f7; border-radius:10px; text-align:center;
    cursor:pointer; font-weight:700; font-size:13px; color:var(--text); background:#faf9ff;
    transition:all .15s; user-select:none;
  }
  .scale-btn:hover{border-color:var(--purple3); background:#f2effc;}
  .scale-btn.selected{background:linear-gradient(135deg,var(--purple1),var(--purple2)); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(106,90,205,.3);}
</style>
</head>

<div class="card">

  <div id="formArea">
    <div class="header">
      <div class="emoji" id="headerEmoji">🔔</div>
      <h1 id="headerTitle">Bell Ringer</h1>
      <div class="sub" id="headerSub">Take 3 minutes to respond.</div>
    </div>

    <form id="responseForm">
      <!-- Day of week dropdown -->
      <div class="form-section">
        <label for="day_of_week">Day of the week</label>
        <select id="day_of_week" name="day_of_week" required>
          <option value="">— Select the day —</option>
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
        </select>
      </div>

      <!-- Class period dropdown -->
      <div class="form-section">
        <label for="class_period">Class period</label>
        <select id="class_period" name="class_period" required>
          <option value="">— Select your period —</option>
          <option value="6A">6A</option>
          <option value="6B">6B</option>
          <option value="7">7th grade</option>
          <option value="8A">8A</option>
          <option value="8B">8B</option>
        </select>
      </div>

      <!-- Name dropdown -->
      <div class="form-section">
        <label for="student_name">Your name</label>
        <select id="student_name" name="student_name" required>
          <option value="">— Select your period first —</option>
        </select>
      </div>

      <div class="divider"></div>

      <!-- Response fields (up to 7) -->
      <div id="questionsContainer"></div>

      <div class="nav">
        <button type="submit" class="btn-submit" id="submitBtn">Submit</button>
      </div>
    </form>
  </div>

  <div id="doneArea" style="display:none;" class="done">
    <div class="emoji">✅</div>
    <h2>Done!</h2>
    <p>Your response was submitted.</p>
    <div class="status" id="submitStatus">Sending...</div>
  </div>

</div>

const periodSelect = document.getElementById('class_period');
const daySelect = document.getElementById('day_of_week');

const updateForm = () => {
  const selectedDay = daySelect.value;
  const selectedPeriod = periodSelect.value;
  
  // Build questions if both day and period are selected
  if(selectedDay && selectedPeriod){
    buildQuestionsForDayAndPeriod(selectedDay, selectedPeriod);

    container.innerHTML = ''; // Clear questions if either is missing
  }

  rosterSelect.innerHTML = '';
  
  if(!selectedPeriod){

    option.value = '';
    option.textContent = '— Select your period first —';

      rosterSelect.appendChild(opt);
    });

// Global tracking for responses
const container = document.getElementById('questionsContainer');
let questionData = {}; // Track selected values for multi-select
let currentPeriodQuestionCount = 0; // Track how many questions for current period

// Function to build questions for selected day and period
function buildQuestionsForDayAndPeriod(day, period){
  container.innerHTML = ''; // Clear existing questions
  questionData = {}; // Reset multi-select data
  
  if(!day || !period) return;
  
  const dayPeriodConfig = SETTINGS.questionsByPeriodAndDay[period] && SETTINGS.questionsByPeriodAndDay[period][day];
  if(!dayPeriodConfig) return;
  
  const questions = dayPeriodConfig.questions;
  currentPeriodQuestionCount = questions.length;
  
  questions.forEach((qConfig, idx) => {
    const i = idx + 1;
    const fieldDiv = document.createElement('div');
    fieldDiv.className = 'form-section question-field active';
    fieldDiv.id = `q${i}-field`;
    
    const label = document.createElement('div');
    label.className = 'q-label';
    label.textContent = qConfig.text;
    
    fieldDiv.appendChild(label);
    
    // Create input based on type
    const qType = qConfig.type || 'text';
    
    if(qType === 'text'){
      const textarea = document.createElement('textarea');
      textarea.name = `response_${i}`;
      textarea.id = `response_${i}`;
      textarea.placeholder = 'Type your response...';
      fieldDiv.appendChild(textarea);
    }
    else if(qType === 'number-choice'){
      const optionsDiv = document.createElement('div');
      optionsDiv.className = 'options opt-grid';
      (qConfig.options || []).forEach(opt => {
        const btn = document.createElement('div');
        btn.className = 'opt';
        btn.textContent = opt;
        btn.dataset.value = opt;
        btn.addEventListener('click', () => {
          optionsDiv.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          const hiddenInput = document.getElementById(`response_${i}`);
          if(hiddenInput) hiddenInput.value = opt;
        });
        optionsDiv.appendChild(btn);
      });
      const hiddenInput = document.createElement('input');
      hiddenInput.type = 'hidden';
      hiddenInput.id = `response_${i}`;
      hiddenInput.name = `response_${i}`;
      fieldDiv.appendChild(optionsDiv);
      fieldDiv.appendChild(hiddenInput);
    }
    else if(qType === 'scale'){
      const min = qConfig.min || 1;
      const max = qConfig.max || 5;
      const scaleDiv = document.createElement('div');
      scaleDiv.className = 'scale-row';
      for(let j = min; j <= max; j++){
        const btn = document.createElement('div');
        btn.className = 'scale-btn';
        btn.textContent = j;
        btn.dataset.value = j;
        btn.addEventListener('click', () => {
          scaleDiv.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          const hiddenInput = document.getElementById(`response_${i}`);
          if(hiddenInput) hiddenInput.value = j;
        });
        scaleDiv.appendChild(btn);
      }
      const hiddenInput = document.createElement('input');
      hiddenInput.type = 'hidden';
      hiddenInput.id = `response_${i}`;
      hiddenInput.name = `response_${i}`;
      fieldDiv.appendChild(scaleDiv);
      fieldDiv.appendChild(hiddenInput);
    }
    else if(qType === 'multi-select'){
      const optionsDiv = document.createElement('div');
      optionsDiv.className = 'options';
      questionData[`response_${i}`] = [];
      (qConfig.options || []).forEach(opt => {
        const checkDiv = document.createElement('div');
        checkDiv.style.display = 'flex';
        checkDiv.style.alignItems = 'center';
        checkDiv.style.gap = '8px';
        checkDiv.style.padding = '10px 0';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = opt;
        checkbox.style.width = '18px';
        checkbox.style.height = '18px';
        checkbox.style.cursor = 'pointer';
        checkbox.addEventListener('change', () => {
          const arr = questionData[`response_${i}`] || [];
          if(checkbox.checked){
            if(!arr.includes(opt)) arr.push(opt);
          } else {
            questionData[`response_${i}`] = arr.filter(x => x !== opt);
          }
          questionData[`response_${i}`] = arr;
        });
        
        const label = document.createElement('label');
        label.textContent = opt;
        label.style.cursor = 'pointer';
        label.style.margin = '0';
        
        checkDiv.appendChild(checkbox);
        checkDiv.appendChild(label);
        optionsDiv.appendChild(checkDiv);
      });
      fieldDiv.appendChild(optionsDiv);
    }
    
    container.appendChild(fieldDiv);
  });
}

// Form submission
document.getElementById('responseForm').addEventListener('submit', (e) => {
  e.preventDefault();
  
  const name = document.getElementById('student_name').value;
  const period = document.getElementById('class_period').value;
  const day = document.getElementById('day_of_week').value;
  
  if(!name || !period || !day){
    alert('Please select your name, class period, and day of the week.');
    return;
  }
  
  document.getElementById('formArea').style.display = 'none';
  document.getElementById('doneArea').style.display = 'block';
  
  const formData = new FormData();
  formData.append(ENTRIES.student_name, name);
  formData.append(ENTRIES.class_period, period);
  formData.append(ENTRIES.day_of_week, day);
  
  for(let i = 1; i <= currentPeriodQuestionCount; i++){
    const dayPeriodConfig = SETTINGS.questionsByPeriodAndDay[period] && SETTINGS.questionsByPeriodAndDay[period][day];
    const qConfig = dayPeriodConfig && dayPeriodConfig.questions[i-1];
    let val = '';
    
    if(qConfig && qConfig.type === 'multi-select'){
      val = (questionData[`response_${i}`] || []).join(', ');
    } else {
      const input = document.getElementById(`response_${i}`);
      val = input ? input.value : '';
    }
    
    formData.append(ENTRIES[`response_${i}`], val || '');
  }
  
  fetch(FORM_URL, { method:'POST', mode:'no-cors', body: formData })
    .then(()=>{ document.getElementById('submitStatus').textContent = 'All set!'; })
    .catch(()=>{ document.getElementById('submitStatus').textContent = 'Submitted (offline check unavailable).'; });
});
</script>
