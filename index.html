<html lang="en">
<head>
<meta charset="UTF-8">
<title>Molecute | Ms. Miller's Science Classroom</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    --purple: #e2a9f1; --purple-deep: #a883ff; --purple-ink: #4a2560;
    --pink: #ff5fae; --lime: #b6e84c; --skyblue: #7ec8f2; --cherry: #e0264f;
    --bg: #fdf9ff; --line: #f2e2fa;
    background: var(--bg); color: var(--purple-ink); font-family: 'DM Sans', sans-serif;
  }
  a { color: inherit; }

  /* ===== NAV ===== */
  nav.topnav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 28px; border-bottom: 2px solid var(--line); position: sticky; top: 0;
    background: #fff; z-index: 100;
  }
  .brand { display: flex; align-items: center; text-decoration: none; }
  .brand img { height: 38px; display: block; }
  .navlinks { display: flex; align-items: center; gap: 4px; list-style: none; font-family: 'Space Grotesk', sans-serif; }
  .navlinks li { position: relative; }
  .navlinks > li > a, .navlinks > li > button {
    font-weight: 600; font-size: 0.95rem; color: var(--purple-deep);
    text-decoration: none; padding: 9px 15px; border-radius: 999px; border: none;
    background: none; cursor: pointer; display: flex; align-items: center; gap: 5px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .navlinks > li > a:hover, .navlinks > li > button:hover { background: #f7ecfc; }
  .caret { font-size: 0.6rem; transition: transform 0.2s; }
  .navlinks > li.open .caret { transform: rotate(180deg); }
  .dropdown {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    background: #fff; border: 2px solid var(--line); border-radius: 16px;
    min-width: 190px; box-shadow: 0 8px 28px rgba(122,63,160,0.16); overflow: hidden; flex-direction: column;
  }
  .navlinks > li.open .dropdown { display: flex; }
  .dropdown a { padding: 12px 18px; text-decoration: none; font-size: 0.9rem; font-weight: 600; color: var(--purple-deep); display: flex; gap: 9px; align-items: center; }
  .dropdown a:hover { background: var(--bg); }
  .dropdown a + a { border-top: 1px solid var(--line); }

  /* ===== HERO ===== */
  .hero-banner { width: 100%; display: block; }
  .hero-ctas {
    padding: 26px 28px 40px; background: linear-gradient(155deg, var(--purple-deep) 0%, var(--purple) 100%);
    display: flex; justify-content: center;
  }
  .btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: var(--pink); color: #fff; font-weight: 700; padding: 12px 22px; border-radius: 999px;
    font-family: 'Space Grotesk',sans-serif; text-decoration: none; display: inline-block; border: none; cursor: pointer;
  }
  .btn.ghost { background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.55); color: #fff; }

  /* ===== SECTIONS ===== */
  .section-label { display: flex; align-items: center; gap: 14px; padding: 40px 28px 18px; max-width: 1100px; margin: 0 auto; }
  .section-label h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.35rem; color: var(--purple-deep); }
  .section-label::after { content:''; flex:1; height: 3px; background: var(--line); border-radius: 3px; }
  .section-note { max-width: 1100px; margin: -8px auto 0; padding: 0 28px 4px; font-size: 0.9rem; color: #777; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 16px; padding: 0 28px 8px; max-width: 1100px; margin: 0 auto; }
  .card {
    background: #fff; border: 2px solid var(--line); border-radius: 22px; padding: 22px;
    transition: 0.15s; text-decoration: none; display: block; color: inherit;
  }
  .card:hover { border-color: var(--purple); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(122,63,160,0.14); }
  .card .icon { font-size: 1.8rem; margin-bottom: 8px; }
  .card h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.08rem; margin-bottom: 5px; color: var(--purple-ink); }
  .card p { font-size: 0.87rem; color: #666; line-height: 1.5; }
  .card.hub { border-color: var(--skyblue); }
  .card.hub:hover { border-color: var(--purple-deep); }

  /* ===== GRADE CARDS ===== */
  .grade-grid {
    display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 20px;
    padding: 0 28px 8px; max-width: 1100px; margin: 0 auto;
  }
  .grade-card {
    border: none; border-radius: 22px; overflow: hidden; cursor: pointer; padding: 0;
    display: block; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s;
    background: none;
  }
  .grade-card img { width: 100%; display: block; }
  .grade-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(122,63,160,0.25); }

  /* ===== PERIOD PICKER MODAL ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(74,37,96,0.55);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 26px; padding: 30px 28px; max-width: 340px; width: 100%;
    text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-box h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; color: var(--purple-deep); margin-bottom: 6px; }
  .modal-box p { font-size: 0.88rem; color: #777; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 12px; }
  .modal-btns button {
    flex: 1; border: none; border-radius: 16px; padding: 16px 10px; font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 1rem; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--purple-deep), var(--purple)); transition: opacity 0.15s;
  }
  .modal-btns button:hover { opacity: 0.88; }
  .modal-close {
    margin-top: 16px; background: none; border: none; color: #999; font-size: 0.85rem;
    cursor: pointer; text-decoration: underline; font-family: 'DM Sans', sans-serif;
  }

  /* ===== ARCHIVE CALLOUT ===== */
  .archive-callout {
    max-width: 1100px; margin: 44px auto 8px; padding: 24px 28px;
  }
  .archive-box {
    background: #fff; border: 2px dashed var(--purple); border-radius: 22px;
    padding: 22px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between;
  }
  .archive-box .txt h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1.05rem; color: var(--purple-deep); margin-bottom: 4px; }
  .archive-box .txt p { font-size: 0.88rem; color: #666; max-width: 480px; }
  .archive-box .btn { background: var(--purple-deep); }

  /* ===== FOOTER ===== */
  footer { padding: 28px 20px; font-size: 0.85rem; color: #777; text-align: center; border-top: 1px solid var(--line); margin-top: 40px; }
  .footer-content { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .cc-license img { height: 1.2em; width: auto; vertical-align: middle; margin-left: 2px; }
  .cc-license a { text-decoration: none; color: inherit; font-weight: bold; }
  .cc-license a:hover { text-decoration: underline; }

  @media (max-width: 500px) {
    nav.topnav { padding: 10px 14px; }
    .brand img { height: 32px; }
  }
</style>
</head>

<script>
  function openPeriodModal(){ document.getElementById('periodModal').classList.add('open'); }
  function closePeriodModal(){ document.getElementById('periodModal').classList.remove('open'); }
  document.getElementById('periodModal').addEventListener('click', (e) => {
    if (e.target.id === 'periodModal') closePeriodModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePeriodModal();
  });

  (function(){
    const ddItems = document.querySelectorAll(".dd-item");
    ddItems.forEach(item => {
      const btn = item.querySelector("button");
      if (!btn) return;
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = !item.classList.contains("open");
        ddItems.forEach(i => { i.classList.remove("open"); i.querySelector("button").setAttribute("aria-expanded","false"); });
        if (isOpen) { item.classList.add("open"); btn.setAttribute("aria-expanded","true"); }
      });
    });
    document.addEventListener("click", () => {
      ddItems.forEach(i => { i.classList.remove("open"); i.querySelector("button").setAttribute("aria-expanded","false"); });
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") ddItems.forEach(i => { i.classList.remove("open"); i.querySelector("button").setAttribute("aria-expanded","false"); });
    });
  })();
</script>
