<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode Simulation</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --ink: #1e293b;
            --muted: #64748b;
            --accent: #16a34a;
            --accent-glow: rgba(22, 163, 74, 0.2);
            --danger: #ef4444;
            --shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.1);
            --radius: 24px;
        }

        * { box-sizing: border-box; transition: background 0.4s, opacity 0.4s; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Dark mode for battery saving */
        body.blackout {
            background: #000000 !important;
        }
        
        .blackout .card {
            opacity: 0.1;
            pointer-events: none;
        }
        
        .blackout #saver-btn {
            opacity: 1 !important;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            z-index: 1000;
            pointer-events: auto;
        }

        .container { width: 90%; max-width: 420px; text-align: center; }

        .card {
            background: var(--card);
            padding: 40px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: var(--accent-glow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        h1 { font-size: 24px; font-weight: 800; margin: 0 0 10px; }
        p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }

        .timer-display {
            font-size: 72px;
            font-weight: 900;
            color: var(--accent);
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .stat-box {
            padding: 12px;
            background: #f1f5f9;
            border-radius: 12px;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .stat-val {
            display: block;
            font-size: 20px;
            color: var(--ink);
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: #1e293b; color: white; }
        .btn-ghost { background: transparent; color: var(--muted); text-decoration: underline; font-size: 13px; }

        #status-msg {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            min-height: 40px;
            padding: 0 10px;
        }

        .warning { color: var(--danger); animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
        </div>
        <h1>Focus & Earn</h1>
        <p>Keep this tab open and your screen on. If you leave to check another app, your progress resets!</p>

        <div class="timer-display" id="timer">00:00</div>

        <div class="stats">
            <div class="stat-box">Points<span class="stat-val" id="points">0</span></div>
            <div class="stat-box">Session<span class="stat-val" id="session-type">Active</span></div>
        </div>

        <button class="btn btn-primary" id="start-btn">Start Session</button>
        <button class="btn btn-secondary" id="saver-btn" style="display:none;">Battery Saver (Blackout)</button>
        <button class="btn btn-ghost" id="submit-btn" style="display:none;">Submit</button>
        
        <div id="status-msg"></div>
    </div>
</div>

<script>
 // --- CONFIGURATION FROM TRACKER ---
const SIM_ID = "focus_mode";
const TOKEN_SALT = "MoLeCuTeOrG";
const FORM_BASE_URL = "https://docs.google.com/forms/d/e/1FAIpQLSckXbWQsVWobjrktGMoF7AtY6gMch0eQMjsGlddVv1cxgNHgQ/formResponse";
const FORM_ENTRIES = {
  displayName: "entry.366340186",
  sim: "entry.1832756779",
  score: "entry.221944829",
  token: "entry.1636605257",
};

let startTime = null;
let isActive = false;
let wakeLock = null;
let timerInterval = null;
let totalMinutes = 0;

// --- SECURITY TOKEN LOGIC ---
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return ("00000000" + h.toString(16)).slice(-8);
}

function makeToken(name, score) {
  const payload = {
    v: 1,
    sim: SIM_ID,
    name: name,
    score: score,
    t: Date.now(),
    nonce: Math.random().toString(36).slice(2, 10),
  };
  const core = JSON.stringify(payload);
  payload.sig = fnv1a(core + "|" + TOKEN_SALT);
  return btoa(JSON.stringify(payload));
}

// --- CORE LOGIC ---
const timerEl = document.getElementById('timer');
const pointsEl = document.getElementById('points');
const startBtn = document.getElementById('start-btn');
const saverBtn = document.getElementById('saver-btn');
const submitBtn = document.getElementById('submit-btn');
const statusMsg = document.getElementById('status-msg');

document.addEventListener("visibilitychange", () => {
  if (document.hidden && isActive) {
    failSession("It looks like you left the page. Timer paused.");
  }
});

function failSession(msg) {
  isActive = false;
  clearInterval(timerInterval);
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  document.body.classList.remove('blackout');
  statusMsg.innerHTML = `<span class="warning">${msg}</span>`;
  startBtn.disabled = false;
  startBtn.textContent = "Restart Session";
  saverBtn.style.display = "none";
  submitBtn.style.display = "none";
}

async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } 
    catch (err) { console.error("Wake Lock failed"); }
  }
}

function updateTimer() {
  const diffInSecs = Math.floor((Date.now() - startTime) / 1000);
  totalMinutes = Math.floor(diffInSecs / 60);
  const secs = diffInSecs % 60;
  timerEl.textContent = `${totalMinutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  pointsEl.textContent = totalMinutes;
}

startBtn.onclick = async () => {
  isActive = true;
  startTime = Date.now();
  startBtn.disabled = true;
  startBtn.textContent = "Focusing...";
  saverBtn.style.display = "block";
  submitBtn.style.display = "block";
  statusMsg.innerHTML = "Screen lock disabled. Face down now.";
  await requestWakeLock();
  timerInterval = setInterval(updateTimer, 1000);
};

saverBtn.onclick = (e) => {
  e.stopPropagation();
  document.body.classList.toggle('blackout');
  saverBtn.textContent = document.body.classList.contains('blackout') ? "Tap to Exit Saver" : "Battery Saver (Blackout)";
};

submitBtn.onclick = async () => {
  // Update one last time
  updateTimer();
  
  const name = prompt(`Submit ${totalMinutes} focus points? Enter your name:`);
  if (!name) return;

  // Visual feedback 
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  const token = makeToken(name, totalMinutes);
  const body = new URLSearchParams();
  body.set(FORM_ENTRIES.displayName, name);
  body.set(FORM_ENTRIES.sim, SIM_ID);
  body.set(FORM_ENTRIES.score, String(totalMinutes));
  body.set(FORM_ENTRIES.token, token);

  try {
    // Adding 'await' 
    await fetch(FORM_BASE_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: body.toString(),
    });

    alert("Points submitted! Screen will now reset.");
  } catch (error) {
    console.error(error);
    alert("Network error. Please show your screen to your teacher before closing!");
  } finally {
    location.reload();
  }
};
</script>

</body>
</html>
