<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode | Earn Extra Credit</title>
    <style>
        :root {
            --bg: #f0fdf4; /* Light green theme for focus */
            --card: #ffffff;
            --ink: #1f2a37;
            --muted: #64748b;
            --accent: #22c55e;
            --accent-dark: #16a34a;
            --shadow: 0 10px 28px rgba(0, 0, 0, 0.05);
            --radius: 20px;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .card {
            background: var(--card);
            padding: 40px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.05);
        }

        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: var(--muted); margin-bottom: 30px; font-size: 14px; line-height: 1.5; }

        .timer-display {
            font-size: 64px;
            font-weight: 800;
            color: var(--accent);
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-val {
            display: block;
            font-size: 18px;
            color: var(--ink);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        #status-msg {
            margin-top: 20px;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
        }

        .warning { color: #dc2626; }
        .success { color: var(--accent-dark); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Focus Session</h1>
        <p>Put your phone down and focus on your work. Locking your screen is okay, but switching apps will reset the timer!</p>

        <div class="timer-display" id="timer">00:00</div>

        <div class="stats">
            <div class="stat-box">Points Earned<span class="stat-val" id="points">0</span></div>
        </div>

        <button class="btn" id="startBtn">Start Focusing</button>
        <button class="btn" id="submitBtn" style="display:none; margin-top:10px; background:#1e293b;">Submit Points</button>
        
        <div id="status-msg"></div>
    </div>
</div>

<script>
const SIM_ID = "focus_mode";
const FORM_BASE_URL = "https://docs.google.com/forms/d/e/YOUR_FORM_ID/formResponse";
const FORM_ENTRIES = {
    name: "entry.366340186",
    sim: "entry.1832756779",
    score: "entry.221944829"
};

let startTime = null;
let isActive = false;
let totalMinutes = 0;

const timerEl = document.getElementById('timer');
const pointsEl = document.getElementById('points');
const startBtn = document.getElementById('startBtn');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('status-msg');

// This runs every time the student re-opens the browser/unlocks phone
document.addEventListener("visibilitychange", () => {
    if (!document.hidden && isActive) {
        updateProgress();
    }
});

function updateProgress() {
    if (!startTime) return;
    
    const now = Date.now();
    const diffInMs = now - startTime;
    const diffInSecs = Math.floor(diffInMs / 1000);
    
    const mins = Math.floor(diffInSecs / 60);
    const secs = diffInSecs % 60;
    
    // Update display
    timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    pointsEl.textContent = mins;
    totalMinutes = mins;
}

startBtn.onclick = () => {
    isActive = true;
    startTime = Date.now();
    startBtn.disabled = true;
    startBtn.textContent = "Focusing...";
    submitBtn.style.display = "block";
    statusMsg.innerHTML = '<span class="success">Lock your phone now! Come back when you are finished.</span>';
    
    // Keep a "fake" visual timer running while the screen is ON
    setInterval(() => {
        if (!document.hidden && isActive) updateProgress();
    }, 1000);
};

submitBtn.onclick = () => {
    updateProgress(); // Final check
    const name = prompt(`You earned ${totalMinutes} points! Enter your name to submit:`);
    if (!name) return;

    const params = new URLSearchParams();
    params.set(FORM_ENTRIES.name, name);
    params.set(FORM_ENTRIES.sim, SIM_ID);
    params.set(FORM_ENTRIES.score, totalMinutes);

    fetch(FORM_BASE_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: params.toString()
    }).then(() => {
        alert("Points submitted!");
        location.reload();
    });
};
</script>

</body>
</html>
