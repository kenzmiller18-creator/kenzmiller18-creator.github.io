<html lang="en">

<meta charset="UTF-8">
<title>Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,900;1,600&family=Nunito:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6d2ff; --card:#f9f4fd; --ink:#1f1f1f; --ink-soft:#40334f;
    --teal:#4c13a8; --teal-dark:#370e7a; --mustard:#f04bd8; --plum:#ff6b6b;
    --line:#e2d5ee; --radius:18px;
    font-family:'Nunito',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);background-image:radial-gradient(circle at 1px 1px, rgba(32,48,45,0.05) 1px, transparent 0);background-size:22px 22px;color:var(--ink);min-height:100vh;padding:32px 16px 80px;}
  .wrap{max-width:640px;margin:0 auto;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
  header.top h1{font-family:'Fraunces',serif;font-weight:900;font-size:29px;margin:0;letter-spacing:-0.01em;color:var(--teal-dark);}
  header.top .sub{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);}

  .tabs{display:flex;gap:6px;margin-bottom:-1px;position:relative;z-index:2;flex-wrap:wrap;}
  .tabs .tab{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:8px 12px 10px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:#E4DBC4;color:var(--ink-soft);transition:all .15s ease;}
  .tabs .tab.active{background:var(--card);color:var(--teal-dark);font-weight:700;transform:translateY(-2px);}
  .tabs .tab.done{color:var(--teal);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);padding:28px 24px;box-shadow:0 2px 0 rgba(32,48,45,0.04), 0 12px 24px -18px rgba(32,48,45,0.35);min-height:340px;display:flex;flex-direction:column;}
  .step-title{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:23px;margin:0 0 4px;}
  .step-hint{font-size:13px;color:var(--ink-soft);margin:0 0 20px;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;flex:1;align-content:start;}
  .grid.one-col{grid-template-columns:1fr;}
  .opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:14px 12px;cursor:pointer;font-size:14.5px;font-weight:500;text-align:left;transition:border-color .12s ease, background .12s ease, transform .08s ease;display:flex;align-items:center;gap:9px;}
  .opt:hover{border-color:var(--teal);transform:translateY(-1px);}
  .opt .mark{width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid var(--line);}
  .opt.radio .mark{border-radius:50%;}
  .opt.selected{border-color:var(--teal);background:rgba(76,19,168,0.08);}
  .opt.selected .mark{background:var(--teal);border-color:var(--teal);}
  .sauce-opt{flex-direction:column;align-items:flex-start;gap:2px;}
  .sauce-opt .name{font-family:'Fraunces',serif;font-weight:700;font-size:18px;}
  .sauce-opt .meta{font-size:12px;color:var(--ink-soft);font-weight:400;}
  .type-opt{flex-direction:column;align-items:flex-start;gap:4px;padding:20px 16px;}
  .type-opt .name{font-family:'Fraunces',serif;font-weight:700;font-size:19px;}
  .type-opt .meta{font-size:12.5px;color:var(--ink-soft);font-weight:400;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  button{font-family:'Nunito',sans-serif;font-size:13.5px;font-weight:700;border-radius:8px;padding:10px 18px;border:1.5px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;transition:opacity .12s ease, transform .08s ease;box-shadow:0 4px 14px rgba(76,19,168,.25);}
  button.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  button.small{padding:6px 10px;font-size:12px;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  button:not(:disabled):hover{transform:translateY(-1px);}

  .review-list{list-style:none;padding:0;margin:0 0 14px;font-size:14px;}
  .review-list li{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;}
  .review-list li b{font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--teal-dark);min-width:64px;padding-top:1px;}

  .scale-row{display:flex;gap:8px;margin:6px 0 18px;}
  .scale-btn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;font-family:'Space Mono',monospace;font-size:13px;cursor:pointer;}
  .scale-btn.selected{border-color:var(--teal);background:rgba(76,19,168,0.08);color:var(--teal-dark);font-weight:700;}

  .section-label{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-dark);margin:30px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .plan-header{display:flex;justify-content:space-between;align-items:baseline;}

  .meal-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .meal-card .name{font-family:'Fraunces',serif;font-weight:700;font-size:17px;}
  .meal-card .desc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
  .meal-card .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .meal-card select{font-family:'Space Mono',monospace;font-size:11px;border-radius:6px;border:1px solid var(--line);padding:3px 4px;background:#fff;}
  .meal-card .rm{background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:0 2px;font-weight:400;}
  .meal-card .rm:hover{color:var(--plum);}

  .empty{font-size:13.5px;color:var(--ink-soft);font-style:italic;padding:14px 0;}

  .grocery-group{margin-bottom:14px;}
  .grocery-group h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mustard);margin:0 0 6px;font-weight:700;}
  .g-item{display:flex;align-items:center;gap:9px;padding:6px 2px;font-family:'Space Mono',monospace;font-size:13.5px;border-bottom:1px solid #EDE6D3;}
  .g-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--teal);flex:none;cursor:pointer;}
  .g-item.checked .g-name, .g-item.checked .g-amt{text-decoration:line-through;color:var(--ink-soft);}
  .g-item .g-name{flex:1;cursor:pointer;}
  .g-item .g-amt{color:var(--ink-soft);cursor:text;min-width:70px;text-align:right;}
  .g-item .g-amt:hover{color:var(--teal-dark);}
  .g-item .g-x{background:none;border:none;color:var(--line);cursor:pointer;font-size:13px;padding:0 2px;}
  .g-item .g-x:hover{color:var(--plum);}
  .g-item input.amt-edit{width:80px;font-family:'Space Mono',monospace;font-size:12.5px;border:1px solid var(--teal);border-radius:4px;padding:2px 4px;}

  .add-item-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .add-item-row input, .add-item-row select{font-family:'Nunito',sans-serif;font-size:12.5px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;}
  .add-item-row input[name=iname]{flex:2;min-width:110px;}
  .add-item-row input[name=iamt]{flex:1;min-width:70px;}
  .add-item-row select{flex:1;min-width:120px;}

  .add-btn{width:100%;margin-top:8px;background:var(--teal);border-color:var(--teal);}
  .clear-btn{background:transparent;color:var(--plum);border-color:var(--plum);font-size:12px;padding:6px 12px;}
  .basics-toggle{background:transparent;color:var(--teal-dark);border-color:var(--teal);font-size:12px;padding:6px 12px;}

  .basics-editor{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:10px;background:#fff;}
  .basic-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
  .basic-row input, .basic-row select{font-size:12.5px;padding:6px 7px;border:1px solid var(--line);border-radius:6px;}
  .basic-row input[name=bname]{flex:2;min-width:100px;}
  .basic-row input[name=bamt]{flex:1;min-width:60px;}
  .basic-row select{flex:1;min-width:110px;}

  .recipe-form-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .recipe-form-row input{font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;}
  .recipe-form-row input[name=rname]{flex:2;}
  .recipe-form-row input[name=rqty]{flex:0.6;}
  .recipe-form-row input[name=runit]{flex:1;}
</style>
</head>

    [["oil","vinegar","tamari","soy sauce","honey","salsa","jalape","brine","wine","marinara","arrabiata","sauce"],"Condiments & Oils"],
    [["cumin","chili powder","paprika","onion powder","garlic powder","red pepper flake","coriander","salt","pepper","spice","turmeric","oregano","thyme","clove","cinnamon","fenugreek","bay leaf","peppercorn"],"Spices & Baking"]
  ];
  for(const [words,sec] of guesses){ if(words.some(w=>key.includes(w))) return sec; }
  return "Other";
}

/* ---------- quantity formatting ---------- */
function fmtQty(n){
  if(n==null) return '';
  const whole = Math.floor(n+1e-6);
  const frac = +(n-whole).toFixed(3);
  const fracMap = {0.125:'⅛',0.167:'⅙',0.2:'⅕',0.25:'¼',0.333:'⅓',0.375:'⅜',0.4:'⅖',0.5:'½',0.6:'⅗',0.625:'⅝',0.667:'⅔',0.75:'¾',0.8:'⅘',0.833:'⅚',0.875:'⅞'};
  let fracStr='';
  if(frac>0.01){
    let bestK=null,bestD=1;
    for(const k in fracMap){ const d=Math.abs(frac-k); if(d<bestD){bestD=d;bestK=k;} }
    fracStr = bestD<0.03 ? fracMap[bestK] : (''+frac).replace('0.','.');
  }
  if(whole===0 && fracStr) return fracStr;
  if(fracStr) return whole+' '+fracStr;
  return String(whole);
}

function resetSelection(){ sel = { sauce:null, grain:null, veggies:[], protein:[], scale:1 }; }
function goto(s){ screen = s; render(); }

/* ---------- render root ---------- */
function render(){
  renderTabs();
  if(screen==='plan') renderPlan();
  else if(screen==='type') renderType();
  else if(screen==='sauce') renderSauce();
  else if(screen==='grain') renderSingle();
  else if(screen==='veggies') renderMulti('veggies','Pick your veggies','Choose as many as you like.');
  else if(screen==='protein') renderMulti('protein','Pick your protein','Choose as many as you like.');
  else if(screen==='review') renderReview();
  else if(screen==='fixedPick') renderFixedPick();
  else if(screen==='fixedNew') renderFixedNew();
  else if(screen==='fixedReview') renderFixedReview();
}

function renderTabs(){
  if(!STEPS.includes(screen)){ tabsRow.innerHTML=''; return; }
  const idx = STEPS.indexOf(screen);
  tabsRow.innerHTML = STEPS.map((s,i)=>{
    const cls = i===idx?'active':(i<idx?'done':'');
    return `<div class="tab ${cls}">${STEP_LABELS[s]}</div>`;
  }).join('');
}

function saveNewRecipe(){
  const name = newRecipe.name.trim();
  const ings = newRecipe.ingredients
    .filter(i=>i.name.trim())
    .map(i=>({ name:i.name.trim(), qty:(i.qty!==''&&!isNaN(parseFloat(i.qty)))?parseFloat(i.qty):null, unit:i.unit.trim() }));
  if(!name || !ings.length){ alert('Give the recipe a name and at least one ingredient.'); return; }
  const rec = { id:Date.now(), name, ingredients:ings };
  fixedRecipes.push(rec);
  set('fixed-recipes', fixedRecipes);
  fixedSel.recipeId = rec.id; fixedSel.scale = 1;
  goto('fixedReview');
}

  cardArea.innerHTML = `
    <p class="step-title">📖 Add this to the week?</p>
    <p class="step-hint">${r.name}</p>
    <ul class="review-list">${r.ingredients.map(i=>`<li><b>${i.qty?fmtQty(i.qty)+' '+i.unit:i.unit||'—'}</b>${iconFor(i.name)} ${i.name}</li>`).join('')}</ul>
    <div class="step-hint" style="margin-bottom:2px;">Recipe scale</div>
    <div class="scale-row" id="scaleRow"></div>
    <div class="nav-row"><button class="ghost" onclick="goto('fixedPick')">Back</button><button onclick="confirmAddFixed()">Add to weekly plan</button></div>`;
  const row = document.getElementById('scaleRow');
  [1,1.5,2].forEach(v=>{
    const b = document.createElement('button');
    b.className = 'scale-btn'+(fixedSel.scale===v?' selected':'');
    b.textContent = v+'x';
    b.onclick = ()=>{ fixedSel.scale=v; render(); };
    row.appendChild(b);
  });
}

function confirmAddFixed(){
  const r = fixedRecipes.find(x=>x.id===fixedSel.recipeId);
  plan.push({ id:Date.now(), type:'fixed', name:r.name, ingredients:r.ingredients, scale:fixedSel.scale });
  set('weekly-plan', plan);
  fixedSel = { recipeId:null, scale:1 };
  goto('plan');
}

/* ---------- plan + grocery ---------- */
function removeMeal(id){ plan = plan.filter(m=>m.id!==id); set('weekly-plan',plan); render(); }
function updateMealScale(id, val){
  const m = plan.find(x=>x.id===id); if(!m) return;
  m.scale = parseFloat(val); set('weekly-plan',plan); render();
}
function clearWeek(){
  if(!confirm('Clear the whole weekly plan? (grocery list stays as-is)')) return;
  plan = []; set('weekly-plan',plan); render();
}

function buildGrocery(){
  const sauceAgg = {};   // name|unit -> {name,unit,qty,hasQty}
  const servingAgg = {}; // name -> {name,total}

  function addIngredient(name, qty, unit, scale){
    const key = name+'|'+unit;
    if(!sauceAgg[key]) sauceAgg[key] = { name, unit, qty:0, hasQty: qty!=null };
    if(qty!=null) sauceAgg[key].qty += qty*scale;
  }
  function addServing(name, scale){
    if(!servingAgg[name]) servingAgg[name] = { name, total:0 };
    servingAgg[name].total += scale;
  }

  plan.forEach(meal=>{
    const scale = meal.scale || 1;
    if(meal.type==='sauce'){
      const s = SAUCES[meal.sauceKey];
      if(!s) return;
      s.recipeIngredients.forEach(ing=> addIngredient(ing.name, ing.qty, ing.unit, scale) );
      if(meal.grain) addServing(meal.grain, scale);
      meal.veggies.forEach(v=>addServing(v,scale));
      meal.protein.forEach(p=>addServing(p,scale));
    } else if(meal.type==='fixed'){
      meal.ingredients.forEach(ing=> addIngredient(ing.name, ing.qty, ing.unit||'', scale) );
    }
  });

  const rows = []; // {key,name,amount,section,removableGenerated}
  Object.values(sauceAgg).forEach(item=>{
    const key = 'gen::'+item.name.toLowerCase();
    const ov = overrides[key] || {};
    if(ov.hidden) return;
    const amount = ov.amountOverride!=null ? ov.amountOverride :
      (item.hasQty ? (fmtQty(item.qty)+' '+item.unit) : item.unit);
    rows.push({ key, name:item.name, amount, section: sectionFor(item.name), generated:true });
  });
  Object.values(servingAgg).forEach(item=>{
    const key = 'gen::'+item.name.toLowerCase();
    const ov = overrides[key] || {};
    if(ov.hidden) return;
    const amount = ov.amountOverride!=null ? ov.amountOverride :
      (fmtQty(item.total)+' serving'+(Math.abs(item.total-1)<0.01?'':'s'));
    rows.push({ key, name:item.name, amount, section: sectionFor(item.name), generated:true });
  });
  customItems.forEach(ci=>{
    rows.push({ key:'custom::'+ci.id, name:ci.name, amount:ci.amount, section:ci.section, generated:false, customId:ci.id });
  });

  const grouped = {}; SECTIONS.forEach(s=>grouped[s]=[]);
  rows.forEach(r=>{ (grouped[r.section]||grouped['Other']).push(r); });
  Object.values(grouped).forEach(list=>list.sort((a,b)=>a.name.localeCompare(b.name)));
  return grouped;
}

function renderPlan(){
  const groups = buildGrocery();
  const hasItems = Object.values(groups).some(g=>g.length);

  let mealsHtml = '';
  if(!plan.length){
    mealsHtml = `<div class="empty">No dinners planned yet — add one to get started.</div>`;
  } else {
    mealsHtml = plan.map(m=>{
      const title = m.type==='sauce' ? m.sauceName : m.name;
      const icon = m.type==='sauce' ? (SAUCE_ICONS[m.sauceKey]||'🍲') : '📖';
      const bits = m.type==='sauce' ? [m.grain,...m.veggies,...m.protein].filter(Boolean).join(' · ') : m.ingredients.map(i=>i.name).join(' · ');
      return `<div class="meal-card">
        <div><div class="name">${icon} ${title}</div><div class="desc">${bits}</div></div>
        <div class="right">
          <select onchange="updateMealScale(${m.id}, this.value)">
            ${[1,1.5,2].map(v=>`<option value="${v}" ${m.scale===v?'selected':''}>${v}x</option>`).join('')}
          </select>
          <button class="rm" onclick="removeMeal(${m.id})" title="Remove">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  let groceryHtml = '';
  if(!hasItems){
    groceryHtml = `<div class="empty">Grocery list fills in as you add dinners.</div>`;
  } else {
    groceryHtml = SECTIONS.filter(s=>groups[s].length).map(sec=>{
      const rowsHtml = groups[sec].map(row=>{
        const isChecked = !!checked[row.key];
        const isEditing = editingKey===row.key;
        const amtHtml = isEditing
          ? `<input class="amt-edit" id="editInput" value="${row.amount}" onkeydown="if(event.key==='Enter')saveAmountEdit('${row.key}', '${row.generated?'':row.customId}')" />`
          : `<span class="g-amt" onclick="startEdit('${row.key}')">${row.amount}</span>`;
        return `<div class="g-item ${isChecked?'checked':''}">
          <input type="checkbox" ${isChecked?'checked':''} onchange="toggleCheck('${row.key}')">
          <span class="g-name" onclick="toggleCheck('${row.key}')">${iconFor(row.name)} ${row.name}</span>
          ${amtHtml}
          <button class="g-x" onclick="removeRow('${row.key}', ${row.generated}, '${row.customId||''}')" title="Remove">✕</button>
        </div>`;
      }).join('');
      return `<div class="grocery-group"><h4>${sec}</h4>${rowsHtml}</div>`;
    }).join('');
  }

  cardArea.innerHTML = `
    <div class="plan-header">
      <p class="step-title" style="margin-bottom:0;">This week's dinners</p>
      ${plan.length ? '<button class="clear-btn" onclick="clearWeek()">Clear week</button>' : ''}
    </div>
    <p class="step-hint">Build from a saved recipe or customize a sauce-based dinner!</p>
    ${mealsHtml}
    <button class="add-btn" onclick="goto('type')">+ Add a dinner</button>

    <div class="section-label">Grocery list</div>
    <div style="display:flex;gap:8px;margin:-4px 0 10px;">
      <button class="basics-toggle" onclick="addBasicsToList()">+ Add basics</button>
      <button class="basics-toggle" onclick="showBasicsEditor=!showBasicsEditor; render();">${showBasicsEditor?'Hide':'Edit'} basics list</button>
    </div>
    ${showBasicsEditor ? renderBasicsEditorHtml() : ''}
    ${groceryHtml}
    <div class="add-item-row" id="addItemRow">
      <input name="iname" placeholder="Add item">
      <input name="iamt" placeholder="Amount">
      <select name="isec">${SECTIONS.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
      <button class="small" onclick="addCustomItem()">Add</button>
    </div>
  `;
  if(editingKey){
    const inp = document.getElementById('editInput');
    if(inp){ inp.focus(); inp.select(); }
  }
  attachBasicsEditorHandlers();
}

function renderBasicsEditorHtml(){
  const rows = basicsList.map((b,i)=>`
    <div class="basic-row" data-i="${i}">
      <input name="bname" value="${b.name}">
      <input name="bamt" value="${b.amount}">
      <select name="bsec">${SECTIONS.map(s=>`<option value="${s}" ${b.section===s?'selected':''}>${s}</option>`).join('')}</select>
      <button class="g-x" onclick="removeBasic(${i})">✕</button>
    </div>`).join('');
  return `<div class="basics-editor">
    <div id="basicsRows">${rows}</div>
    <button class="ghost small" onclick="addBasicRow()">+ Add basic</button>
  </div>`;
}
function attachBasicsEditorHandlers(){
  if(!showBasicsEditor) return;
  document.querySelectorAll('.basic-row').forEach(row=>{
    const i = +row.dataset.i;
    row.querySelector('[name=bname]').oninput = e=>{ basicsList[i].name=e.target.value; set('basics-list',basicsList); };
    row.querySelector('[name=bamt]').oninput = e=>{ basicsList[i].amount=e.target.value; set('basics-list',basicsList); };
    row.querySelector('[name=bsec]').onchange = e=>{ basicsList[i].section=e.target.value; set('basics-list',basicsList); };
  });
}
function addBasicRow(){ basicsList.push({id:Date.now(),name:"",amount:"",section:"Other"}); set('basics-list',basicsList); render(); }
function removeBasic(i){ basicsList.splice(i,1); set('basics-list',basicsList); render(); }

function addBasicsToList(){
  const existingNames = new Set(customItems.map(c=>c.name.toLowerCase()));
  basicsList.forEach(b=>{
    if(!b.name.trim()) return;
    if(existingNames.has(b.name.toLowerCase())) return;
    customItems.push({ id:Date.now()+Math.random(), name:b.name, amount:b.amount, section:b.section });
  });
  set('grocery-custom-items', customItems);
  render();
}

function addCustomItem(){
  const row = document.getElementById('addItemRow');
  const name = row.querySelector('[name=iname]').value.trim();
  const amount = row.querySelector('[name=iamt]').value.trim();
  const section = row.querySelector('[name=isec]').value;
  if(!name) return;
  customItems.push({ id:Date.now()+Math.random(), name, amount, section });
  set('grocery-custom-items', customItems);
  render();
}

function removeRow(key, generated, customId){
  if(generated === 'true' || generated === true){
    overrides[key] = { ...(overrides[key]||{}), hidden:true };
    set('grocery-overrides', overrides);
  } else {
    customItems = customItems.filter(c=>String(c.id)!==String(customId));
    set('grocery-custom-items', customItems);
  }
  render();
}

function startEdit(key){ editingKey = key; render(); }
function saveAmountEdit(key, customId){
  const val = document.getElementById('editInput').value;
  if(customId){
    const ci = customItems.find(c=>String(c.id)===String(customId));
    if(ci) ci.amount = val;
    set('grocery-custom-items', customItems);
  } else {
    overrides[key] = { ...(overrides[key]||{}), amountOverride: val };
    set('grocery-overrides', overrides);
  }
  editingKey = null;
  render();
}

function toggleCheck(key){ checked[key] = !checked[key]; set('grocery-checked',checked); render(); }

loadState();
</script>
</body>
